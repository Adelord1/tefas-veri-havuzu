name: Tefas Veri Guncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutuphaneleri Kur
        run: npm install

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri kaydet ve Github'a gonder
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add tefas_verileri.json
          git commit -m "TEFAS verileri güncellendi" || echo "Değişiklik yok"
          git pull --rebase origin main
          git push
