name: TEFAS Veri Guncelleme

on:
  schedule:
    - cron: '0 18 * * 1-5' # Hafta içi her gün 18:00'da çalışır (UTC)
  workflow_dispatch: # Manuel tetikleme için

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repoya yazma izni

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutuphaneleri Kur
        run: npm install

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add tefas_verileri.json
          
          # Değişiklik yoksa hata vermemesi için kontrol
          if git diff --staged --quiet; then
            echo "Herhangi bir değişiklik yok."
          else
            git commit -m "TEFAS verileri güncellendi"
            # Çakışmaları önlemek için önce depodaki son değişiklikleri çekiyoruz (işte sorunu çözecek kısım burası)
            git pull --rebase origin main
            # Ardından değişikliklerimizi gönderiyoruz
            git push origin main
          fi
