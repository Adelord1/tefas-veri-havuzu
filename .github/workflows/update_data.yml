name: TEFAS Veri Guncelleme

on:
  schedule:
    - cron: '0 18 * * *' # Her gün 18:00 (UTC)
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write # Bota GitHub'a dosya yükleme yetkisi verir

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git geçmişini tamamen çeker (Eşitleme için gerekli)
          persist-credentials: true

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutuphaneleri Kur
        run: npm install

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Oluşan json dosyasını ekle
          git add tefas_verileri.json
          
          # Eğer dosyada değişiklik varsa commit et
          git diff --quiet && git diff --staged --quiet || git commit -m "TEFAS verileri güncellendi"
          
          # GITHUB'DAKİ SON DEĞİŞİKLİKLERİ ÇEK VE EŞİTLE (Hatanın çözümü burası)
          git pull --rebase origin main
          
          # Şimdi güncel dosyayı GitHub'a gönder
          git push origin main
