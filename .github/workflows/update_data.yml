name: TEFAS Veri Guncelleme

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutuphaneleri Kur
        run: npm install

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # Sadece ilgili dosyamızda değişiklik olup olmadığını kontrol ediyoruz
          if [ -n "$(git status --porcelain tefas_verileri.json)" ]; then
            git add tefas_verileri.json
            git commit -m "TEFAS verileri güncellendi"
            
            # Uzak depodaki (remote) değişiklikleri çek ve üste yaz (-X theirs komutuyla çakışma olursa bizim ürettiğimiz güncel JSON dosyasını kabul etmesini sağlıyoruz)
            git pull --rebase -X theirs origin main
            
            # Güncel veriyi gönder
            git push origin main
          else
            echo "Veriler zaten güncel, commit edilecek bir değişiklik yok."
          fi
