name: TEFAS Veri Guncelleme

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# Bu kısım GitHub Actions'a dosyaları depoya yazma/kaydetme izni verir
permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutuphaneleri Kur
        run: npm install

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Dosyayı ekle ve commit oluştur
          git add tefas_verileri.json
          git commit -m "TEFAS verileri güncellendi" || echo "Değişiklik yok, atlanıyor."

          # Mevcut dalın adını al (genellikle main)
          BRANCH="${{ github.ref_name }}"

          # Uzak sunucudaki güncel değişiklikleri çek ve yerel kodlarla birleştir (rebase)
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH" || (git rebase --abort && echo "Rebase başarısız oldu" && exit 1)

          # Yeni değişiklikleri depoya gönder
          git push origin "HEAD:$BRANCH"
