name: TEFAS Veri Guncelleme

on:
  schedule:
    - cron: '0 18 * * *' # Her gun Turkiye saati ile 21:00'da calisir (UTC 18:00)
  workflow_dispatch: # Manuel olarak butona basip calistirmamiza da olanak tanir

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v3

      - name: Node.js Kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: '18'

    - name: Kütüphaneleri kur
  run: npm install --no-fund --no-audit

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri Kaydet ve GitHub'a Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "Otomatik guncelleme: TEFAS Fon Verileri" || echo "Degisiklik yok"
          git push
