name: Tefas Veri Guncelleme

on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Kutuphaneleri Kur
      run: npm install

    - name: TEFAS Verilerini Cek
      run: node fetch_tefas.js

    - name: Degisiklikleri Kaydet
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add tefas_verileri.json
        git commit -m "TEFAS verileri güncellendi" || echo "Degisiklik yok"
        git push
