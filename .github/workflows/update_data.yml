name: TEFAS Veri Guncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

    - name: Kütüphaneleri Kur
        run: |
          npm cache clean --force
          npm install --no-fund --no-audit --verbose

      - name: TEFAS Verilerini Cek
        run: node fetch_tefas.js

      - name: Degisiklikleri Kaydet ve Githuba Gonder
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "TEFAS verileri guncellendi" || echo "Degisiklik yok"
          git push https://${GH_PAT}@github.com/${{ github.repository }}.git HEAD:main
